# ========== Gateway routes ==========
# Each route: /<prefix>/** -> downstream base URL with first path segment stripped.
# Local profile: many services use fixed localhost/127.0.0.1 URIs to avoid 502 when Eureka
# advertises an unreachable IP. Docker profile uses lb:// service IDs in application-docker.yml.
# Service instances are resolved at runtime from Eureka. Add a new route block
# for any new microservice (same pattern: id, uri lb://<eureka-service-id>, Path, StripPrefix=1).
spring:
  # Allow large JSON bodies (e.g. Base64 signature images) through the reactive gateway
  codec:
    max-in-memory-size: 10MB
  cloud:
    gateway:
      # Microservices reject direct access unless this header is set (GatewayOnlyFilter). Matches application-docker.yml.
      default-filters:
        - SetRequestHeader=X-Internal-Gateway,true
      # Global Netty timeouts (Duration for response; ms for connect). Very long for slow local LLM (Task→AImodel→Ollama).
      httpclient:
        response-timeout: 4h
        connect-timeout: 30000
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:4200"
              - "http://127.0.0.1:4200"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
              - PATCH
            allowedHeaders:
              - Authorization
              - Content-Type
              - Accept
              - Origin
              - X-Requested-With
              - X-User-Id
              - Sec-WebSocket-Key
              - Sec-WebSocket-Version
              - Sec-WebSocket-Protocol
              - Sec-WebSocket-Extensions
            exposedHeaders:
              - Content-Disposition
              - Content-Type
            allowCredentials: true
      discovery:
        locator:
          enabled: false
          lower-case-service-id: true
      routes:
        - id: keycloak-auth
          uri: http://localhost:8079
          predicates:
            - Path=/keycloak-auth/**
          filters:
            - StripPrefix=1

        - id: user
          uri: http://localhost:8090
          predicates:
            - Path=/user/**
          filters:
            - StripPrefix=1

        # Portfolio: URL directe (port 8086) — évite 503 « Unable to find instance for PORTFOLIO »
        # si Eureka n’est pas démarré ou si le service n’est pas enregistré.
        - id: portfolio
          uri: http://localhost:8086
          predicates:
            - Path=/portfolio/**
          filters:
            - StripPrefix=1
          metadata:
            response-timeout: 120000
            connect-timeout: 10000


        # Planning: direct URL (port 8081 from Config Server) — avoids 502 when Eureka advertises a LAN IP
        # Netty cannot use, or when the registry is empty. Docker: application-docker.yml uses lb://PLANNING.
        - id: planning
          uri: ${GATEWAY_PLANNING_URI:http://127.0.0.1:8081}
          predicates:
            - Path=/planning/**
          filters:
            - StripPrefix=1
          metadata:
            response-timeout: 30000
            connect-timeout: 5000

        # Review: direct URL so it works without Eureka (service runs on 8085)
        - id: review
          uri: http://localhost:8085
          predicates:
            - Path=/review/**
          filters:
            - StripPrefix=1

        # Project: direct URL so requests always hit the Project microservice (port 8084)
        - id: project
          uri: http://localhost:8084
          predicates:
            - Path=/project/**
          filters:
            - StripPrefix=1

        # Gamification: achievements, levels, XP (port 8088)
        - id: gamification
          uri: http://localhost:8088
          predicates:
            - Path=/gamification/**
          filters:
            - StripPrefix=1

        # Offer (local IntelliJ default port 8082; use lb://OFFER if you prefer Eureka-only)
        - id: offer
          uri: http://localhost:8082
          predicates:
            - Path=/offer/**
          filters:
            - StripPrefix=1

        - id: contract
          uri: http://localhost:8083
          predicates:
            - Path=/contract/**
          filters:
            - StripPrefix=1

        # Notification (Firestore): direct URL (local default port 8098)
        - id: notification
          uri: http://localhost:8098
          predicates:
            - Path=/notification/**
          filters:
            - StripPrefix=1

        # Ticket: support tickets (must match ticket-service server.port)
        - id: ticket
          uri: http://localhost:8094
          predicates:
            - Path=/ticket/**
          filters:
            - StripPrefix=1

        # Subcontracting Management (port 8110)
        - id: subcontracting
          uri: http://localhost:8110
          predicates:
            - Path=/subcontracting/**
          filters:
            - StripPrefix=1

        # Freelancia Job — direct URL for local IntelliJ (avoids 502 when Eureka advertises a LAN IP Netty can't use).
        # Docker: use application-docker.yml (service hostnames). Override: GATEWAY_FREELANCIA_JOB_URI
        - id: freelancia-job
          uri: ${GATEWAY_FREELANCIA_JOB_URI:http://127.0.0.1:8097}
          predicates:
            - Path=/freelancia-job/**
          filters:
            - StripPrefix=1

        - id: meeting
          uri: ${GATEWAY_MEETING_URI:http://127.0.0.1:8101}
          predicates:
            - Path=/meeting/**
          filters:
            - StripPrefix=1

        - id: chat
          uri: ${GATEWAY_CHAT_URI:http://127.0.0.1:8096}
          predicates:
            - Path=/chat/**
          filters:
            - StripPrefix=1

        # Task AI: match first — long timeouts for Ollama. Direct URL avoids Eureka 502 (same pattern as planning).
        - id: task-ai
          uri: ${GATEWAY_TASK_URI:http://127.0.0.1:8091}
          order: -1
          predicates:
            - Path=/task/api/tasks/ai/**
          filters:
            - StripPrefix=1
          metadata:
            response-timeout: 14400000
            connect-timeout: 30000

        # Task microservice (port 8091)
        - id: task
          uri: ${GATEWAY_TASK_URI:http://127.0.0.1:8091}
          predicates:
            - Path=/task/**
          filters:
            - StripPrefix=1

        # AImodel (local IntelliJ default 8095; use lb://AIMODEL if you prefer Eureka-only)
        - id: aimodel
          uri: http://localhost:8095
          predicates:
            - Path=/aimodel/**
          filters:
            - StripPrefix=1
          metadata:
            response-timeout: 14400000
            connect-timeout: 30000
